<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo | Un Encuentro con Jesús</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos del Administrador y Login -->
  <link rel="stylesheet" href="css/admin.css">

  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="login-badge">EJ</div>
        <h1 class="login-title">Acceso al Sistema</h1>
        <p class="login-subtitle">Asociación Cristiana Un Encuentro con Jesús</p>
      </div>

      <!-- Alerta visual de error / éxito -->
      <div id="loginMessage" class="login-message"></div>

      <!-- Formulario de Autenticación -->
      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="form-label">Correo Electrónico Institucional</label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="pastor@encuentroconjesus.org" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="••••••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn-login">
          <span id="btnText">Iniciar Sesión</span>
        </button>
      </form>

      <div class="login-footer">
        <a href="index.html">&larr; Regresar al Portal Principal</a>
      </div>
    </div>
  </div>

  <!-- Configuración de Supabase -->
  <script src="js/config.js"></script>

  <!-- Lógica de Inicio de Sesión -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const loginForm = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const loginMessage = document.getElementById('loginMessage');
      const btnSubmit = document.getElementById('btnLoginSubmit');
      const btnText = document.getElementById('btnText');

      // Verificar si ya existe una sesión activa
      if (window.db) {
        try {
          const { data: { session } } = await window.db.auth.getSession();
          if (session) {
            window.location.href = 'admin.html';
            return;
          }
        } catch (err) {
          console.warn('Error verificando sesión previa:', err);
        }
      }

      function showMessage(text, isError = true) {
        loginMessage.textContent = text;
        loginMessage.className = `login-message ${isError ? 'error' : 'success'}`;
        loginMessage.style.display = 'block';
      }

      function setLoading(isLoading) {
        btnSubmit.disabled = isLoading;
        if (isLoading) {
          btnText.innerHTML = '<span class="btn-spinner"></span> Autenticando...';
        } else {
          btnText.textContent = 'Iniciar Sesión';
        }
      }

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginMessage.style.display = 'none';

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showMessage('Por favor completa todos los campos.');
          return;
        }

        if (!window.db) {
          showMessage('No se pudo inicializar la conexión con Supabase. Revisa js/config.js.');
          return;
        }

        setLoading(true);

        try {
          const { data, error } = await window.db.auth.signInWithPassword({
            email: email,
            password: password
          });

          if (error) {
            let errorMsg = 'Error al iniciar sesión: ' + error.message;
            if (error.message.includes('Invalid login credentials')) {
              errorMsg = 'Credenciales incorrectas. Verifica el correo y la contraseña.';
            }
            showMessage(errorMsg, true);
            setLoading(false);
            return;
          }

          if (data && data.session) {
            showMessage('Acceso concedido. Redirigiendo al panel...', false);
            setTimeout(() => {
              window.location.href = 'admin.html';
            }, 800);
          }
        } catch (err) {
          showMessage('Ocurrió un error inesperado al conectar con el servidor: ' + err.message, true);
          setLoading(false);
        }
      });
    });
  </script>
</body>
</html>
